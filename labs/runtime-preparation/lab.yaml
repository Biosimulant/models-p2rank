schema_version: '2.0'
package: p2rank-runtime-preparation
version: 0.3.0
title: P2Rank Runtime Preparation
description: Private one-time pinned bundle preparation for the P2Rank binding-pocket
  Lab; not pocket inference.
license: MIT
models:
- alias: acquire
  path: models/acquire
wiring: []
io:
  inputs: []
  outputs:
  - name: runtime_0
    maps_to: acquire.runtime_0
    value_type: file
    format: zip
  - name: runtime_1
    maps_to: acquire.runtime_1
    value_type: file
    format: zip
  - name: viewer
    maps_to: acquire.viewer
    value_type: file
    format: zip
  - name: reference_structures
    maps_to: acquire.reference_structures
    value_type: file
    format: zip
  - name: license_records
    maps_to: acquire.license_records
    value_type: file
    format: zip
  - name: corresponding_sources
    maps_to: acquire.corresponding_sources
    value_type: file
    format: zip
  - name: receipt
    maps_to: acquire.receipt
runtime:
  python_version: '3.12'
  duration: 1
  communication_step: 1
  initial_inputs: {}
hardware:
  compute:
    device: cpu
    cpu_cores: 2
    memory_mb: 4096
    recommended_profile: pro
intended_use:
  statement: Private acquisition of checksum-pinned public files (P2Rank 2.5.1 release,
    3Dmol.js 2.5.5, RCSB structures, notice records, corresponding source); no scientific
    result.
caveats:
- Infrastructure-only preparation; downloads exact public GitHub, npm, RCSB and Maven
  Central files once. Pocket inference uses the retained bundles offline.
prohibited_claims:
- Protein, pocket or biological inference from asset preparation
visualization:
  schema_version: '1'
  required:
  - module: acquire
    render: text
    min_count: 1
