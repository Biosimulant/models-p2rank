schema_version: '2.0'
package: p2rank-runtime-acquire
version: 0.3.0
title: P2Rank Runtime Acquisition
description: Private one-time preparation of the binding-pocket Lab bundles from checksum-pinned
  public sources.
standard: other
license: MIT
biosim:
  entrypoint: src.acquire:AcquireRuntime
  execution_policy: once_before_run
  communication_step: 1.0
io:
  inputs: []
  outputs:
  - name: runtime_0
    signal_type: scalar
    dtype: str
    value_type: file
    format: zip
  - name: runtime_1
    signal_type: scalar
    dtype: str
    value_type: file
    format: zip
  - name: viewer
    signal_type: scalar
    dtype: str
    value_type: file
    format: zip
  - name: reference_structures
    signal_type: scalar
    dtype: str
    value_type: file
    format: zip
  - name: license_records
    signal_type: scalar
    dtype: str
    value_type: file
    format: zip
  - name: corresponding_sources
    signal_type: scalar
    dtype: str
    value_type: file
    format: zip
  - name: receipt
    signal_type: record
    schema:
      source_url: str
      source_sha256: str
      source_size_bytes: int
      runtime_members: int
      excluded_members: json
      repository_raw_base: str
      bundles: json
      all_match: bool
    emitted_unit: '1'
runtime:
  python_version: '3.12'
  dependencies:
    packages:
    - biosimulant==0.0.34
