schema_version: '2.0'
package: p2rank-binding-pockets
version: 0.1.0
title: P2Rank Binding-Pocket Prediction
description: "Upload a protein structure (PDB or mmCIF) and get ranked candidate ligand-binding\
  \ pockets from P2Rank 2.5.1: scores, centers and surface points in \xC5, residue\
  \ assignments with original chain and residue IDs, and a downloadable interactive\
  \ 3D pocket view. Model estimates, not experimentally confirmed binding sites."
license: MIT
models:
- alias: predict
  path: models/predict
wiring: []
io:
  inputs:
  - name: structure_file
    signal_type: scalar
    dtype: str
    value_type: file
    format: pdb
    required: false
    description: Upload protein PDB (<=2MiB); provide exactly one PDB or mmCIF file.
    maps_to: predict.structure_file
  - name: mmcif_file
    signal_type: scalar
    dtype: str
    value_type: file
    format: cif
    required: false
    description: Upload text mmCIF (<=2MiB); preserve author/label chain and residue
      mappings.
    maps_to: predict.mmcif_file
  - name: chains_json
    signal_type: scalar
    dtype: str
    value_type: string
    default: '[]'
    required: false
    max_length: 1024
    description: Selected author chain IDs as JSON list; [] selects all protein chains
      in first model.
    maps_to: predict.chains_json
  - name: top_n
    signal_type: scalar
    dtype: int64
    value_type: integer
    default: 3
    required: false
    description: "Number of top-ranked pockets to return (1\u201310)."
    maps_to: predict.top_n
  outputs:
  - name: report
    signal_type: record
    schema:
      status: str
      pockets: json
      residues: json
      surface_points: json
      receipt: json
    emitted_unit: '1'
    maps_to: predict.report
  - name: pocket_count
    signal_type: scalar
    dtype: int64
    emitted_unit: count
    maps_to: predict.pocket_count
  - name: processed_structure
    signal_type: scalar
    dtype: str
    value_type: file
    format: pdb
    maps_to: predict.processed_structure
  - name: raw_predictions
    signal_type: scalar
    dtype: str
    value_type: file
    format: csv
    maps_to: predict.raw_predictions
  - name: raw_residues
    signal_type: scalar
    dtype: str
    value_type: file
    format: csv
    maps_to: predict.raw_residues
  - name: mapped_residues
    signal_type: scalar
    dtype: str
    value_type: file
    format: csv
    maps_to: predict.mapped_residues
  - name: residue_map
    signal_type: scalar
    dtype: str
    value_type: file
    format: json
    maps_to: predict.residue_map
  - name: report_file
    signal_type: scalar
    dtype: str
    value_type: file
    format: json
    maps_to: predict.report_file
  - name: receipt_file
    signal_type: scalar
    dtype: str
    value_type: file
    format: json
    maps_to: predict.receipt_file
  - name: pocket_view
    signal_type: scalar
    dtype: str
    value_type: file
    format: html
    maps_to: predict.pocket_view
runtime:
  python_version: '3.12'
  duration: 1.0
  communication_step: 1.0
  initial_inputs:
    predict.mmcif_file: fixtures/7L13.cif
    predict.chains_json: '[]'
    predict.top_n: 3
  dependencies:
    packages:
    - biosimulant==0.0.34
    - gemmi==0.7.3
    - jdk4py==21.0.8.1
hardware:
  compute:
    device: cpu
    cpu_cores: 2
    memory_mb: 4096
    recommended_profile: pro
intended_use:
  statement: Research candidate binding-pocket localization from small protein coordinate
    structures; no experimental binding or clinical claim.
caveats:
- Default pretrained P2Rank 2.5.1 model (trained on CHEN11); B-factors contribute
  to its features, so predicted or non-X-ray structures need extra care.
- Uses protein heavy atoms from the first model only; alternate locations resolved
  by highest occupancy; waters, ligands and other non-amino-acid residues removed.
- Original author and label chain/residue IDs, including insertion codes, are preserved
  in the downloadable residue map and labels.
- Scores and probabilities are upstream model estimates, not binding evidence.
- "Exact parity on three reference structures and one held-out 4 \xC5 demonstration\
  \ (7L13) do not establish broad accuracy."
- The native 3D panel previews the processed protein; the downloadable pocket-view.html
  shows colored pocket centers, surface points and residue highlights offline.
- The runtime bundles unmodified GPL/LGPL Java components (e.g. Weka, FastRandomForest,
  CDK, BioJava); notices are in assets/license-records.zip and exact corresponding
  source in assets/corresponding-sources.zip. vecmath-1.3.1 and openchart-1.4.2 are
  omitted from the upstream distribution (outputs verified identical).
prohibited_claims:
- Experimentally confirmed binding site
- Binding affinity
- Clinical utility
- Broad biological validation
visualization:
  schema_version: '1'
  required:
  - module: predict
    render: structure3d
    min_count: 1
  - module: predict
    render: text
    min_count: 1
